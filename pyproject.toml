[project]
name = "sap-integration-copilot"
version = "0.1.0"
description = "Assistente de IA para diagnóstico de incidentes de integração SAP (RAG + agentes + conectores SAP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pandas>=2.2",
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-community>=0.4",
    "langchain-ollama>=1.1",
    "qdrant-client>=1.19",
    "neo4j>=6.2",
    "langfuse>=4.14",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requer stack local viva (Qdrant/Ollama); pulado automaticamente se indisponivel",
]
